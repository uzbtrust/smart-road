# Streamlit paints its own chrome -- sidebar, widgets, focus rings -- before any
# injected CSS runs, so the palette has to be declared here as well as in the
# stylesheet. These values are the site's dark tokens verbatim: plane, surface-1,
# ink-1 and the brand orange.
[theme]
base = "dark"
primaryColor = "#F8A519"
backgroundColor = "#0d0d0d"
secondaryBackgroundColor = "#151513"
textColor = "#f7f7f4"
font = "sans serif"

[server]
headless = true
# Hugging Face serves the Space through its own proxy on a different origin from
# the one the app thinks it is on. Streamlit's XSRF check compares a cookie
# against a token on the upload request, and behind that proxy the cookie does
# not always survive -- the PUT is refused and file_uploader turns red with no
# message a user can act on. Nothing here is authenticated and no data is
# written, so the check is protecting nothing; upload working matters more.
enableXsrfProtection = false
enableCORS = false
maxUploadSize = 300

[browser]
gatherUsageStats = false
