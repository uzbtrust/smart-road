<script>
/* Font gate.
   The Uzbek apostrophe fit (--oz-inset, .sr-oz in styles.css) is measured
   against IBM Plex Sans and is correct for no other face. So the rule is scoped
   to [data-plex="on"] and this is the only place that attribute is set:

     Plex loaded    → attribute set → apostrophes fitted, oʻ gʻ correct.
     Plex missing   → no attribute  → apostrophes unfitted but readable, and a
                      banner says so. Never silently wrong, never pulled into
                      the neighbouring letters.

   The fonts ship in fonts/ so the second branch should not occur; it exists
   because a font can still fail on a misconfigured host, and the failure must
   degrade rather than break. */
document.fonts.ready.then(function () {
  if (document.fonts.check('400 16px "IBM Plex Sans"')) {
    document.documentElement.setAttribute('data-plex', 'on');
    return;
  }
  console.error('IBM Plex Sans failed to load from fonts/. The Uzbek ʻ is left unfitted — check that the .woff2 files deployed and are served as font/woff2.');
  var b = document.createElement('div');
  b.className = 'font-alarm';
  b.textContent = 'IBM Plex Sans failed to load from fonts/ — text is falling back and the Uzbek ʻ is unfitted.';
  document.body.appendChild(b);
});
</script>
</body>
